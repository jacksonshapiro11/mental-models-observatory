name: Publish to Substack

# Daily super brief → Cosmic Trex Substack (draft by default).
# Fires when a *-light.md lands on main, or via workflow_dispatch.
#
# Content choice: light brief (parity with Resend email), not the full brief.
# Spotify link = show page (episode URL not ready at post time).
#
# Required secrets (Settings → Secrets and variables → Actions):
#   SUBSTACK_PUBLICATION_URL  e.g. https://cosmictrex.substack.com  (master switch; absent → no-op)
#   SUBSTACK_EMAIL + SUBSTACK_PASSWORD   OR   SUBSTACK_COOKIES_STRING
#     Cookie form: browser DevTools → Application → Cookies → substack.com
#     copy as "substack.sid=…; substack.lli=…"
#
# Variables (optional):
#   SUBSTACK_MODE         draft (default) | publish
#   SUBSTACK_SEND_EMAIL   true (default) | false   — publish mode only; keep false while Resend is primary

on:
  push:
    branches: [main]
    paths:
      - 'content/daily-updates/*-light.md'
  workflow_dispatch:
    inputs:
      date:
        description: 'Brief date YYYY-MM-DD (defaults to today ET)'
        required: false
        type: string
      mode:
        description: 'Override SUBSTACK_MODE for this run'
        required: false
        type: choice
        options:
          - ''
          - draft
          - publish
        default: ''

concurrency:
  group: publish-substack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Light brief → Substack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve date
        id: meta
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            DATE="$INPUT_DATE"
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'content/daily-updates/*-light.md' 2>/dev/null || true)
            echo "Changed light briefs:"
            echo "$CHANGED"
            DATE=$(echo "$CHANGED" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | head -1 || true)
            if [ -z "$DATE" ]; then
              DATE=$(TZ=America/New_York date +%F)
            fi
          else
            DATE=$(TZ=America/New_York date +%F)
          fi
          if ! echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Bad date: $DATE"
            exit 1
          fi
          echo "BRIEF_DATE=$DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Guard — publication URL configured?
        id: guard
        env:
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
        run: |
          if [ -z "${SUBSTACK_PUBLICATION_URL:-}" ]; then
            echo "::notice::SUBSTACK_PUBLICATION_URL secret not set — Substack leg no-ops. Add it under Settings → Secrets and variables → Actions."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for live light brief
        if: steps.guard.outputs.configured == 'true'
        env:
          DATE: ${{ steps.meta.outputs.date }}
          SITE_URL: https://www.cosmictrex.com
        run: |
          set -euo pipefail
          HEALTH_URL="$SITE_URL/api/publish/health?date=$DATE"
          echo "Polling $HEALTH_URL ..."
          READY=0
          for i in $(seq 1 36); do
            BODY=$(curl -sS "$HEALTH_URL" || true)
            echo "  poll #$i: $BODY"
            echo "$BODY" | grep -q '"lightBrief":true' && READY=1 && break
            sleep 10
          done
          if [ "$READY" != "1" ]; then
            echo "::error::Deploy health timeout — lightBrief never true for $DATE"
            exit 1
          fi

      - name: Set up Python
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-substack
        if: steps.guard.outputs.configured == 'true'
        run: pip install --quiet 'python-substack==0.1.27' 'markdown-it-py'

      - name: Publish to Substack
        if: steps.guard.outputs.configured == 'true'
        env:
          DATE: ${{ steps.meta.outputs.date }}
          INPUT_MODE: ${{ inputs.mode }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          SUBSTACK_COOKIES_STRING: ${{ secrets.SUBSTACK_COOKIES_STRING }}
          # Script defaults: MODE=draft, SEND_EMAIL=true (publish mode only).
          # Set repo Variables to override; leave unset for safe draft-first rollout.
          SUBSTACK_MODE: ${{ vars.SUBSTACK_MODE }}
          SUBSTACK_SEND_EMAIL: ${{ vars.SUBSTACK_SEND_EMAIL }}
        run: |
          set -euo pipefail
          MODE_ARG=()
          if [ -n "${INPUT_MODE:-}" ]; then
            MODE_ARG=(--mode="$INPUT_MODE")
          fi
          python3 scripts/publish-substack.py --date="$DATE" "${MODE_ARG[@]}"
